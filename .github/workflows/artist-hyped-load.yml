name: Artist Hyped Load

on:
  pull_request:
    paths:
      - '.github/workflows/artist-hyped-load.yml'
      - 'src/main/java/dev/espero/festival/web/ArtistHyped*'
      - 'src/main/java/dev/espero/festival/persistence/ArtistHypedStore.java'
      - 'src/main/java/dev/espero/festival/ratelimit/**'
      - 'src/main/resources/application.yml'
      - 'src/main/resources/db/migration/V30__create_artist_hyped_counts.sql'
      - 'src/test/java/dev/espero/festival/e2e/ArtistHypedHttpE2eTest.java'
      - 'pom.xml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/artist-hyped-load.yml'
      - 'src/main/java/dev/espero/festival/web/ArtistHyped*'
      - 'src/main/java/dev/espero/festival/persistence/ArtistHypedStore.java'
      - 'src/main/java/dev/espero/festival/ratelimit/**'
      - 'src/main/resources/application.yml'
      - 'src/main/resources/db/migration/V30__create_artist_hyped_counts.sql'
      - 'src/test/java/dev/espero/festival/e2e/ArtistHypedHttpE2eTest.java'
      - 'pom.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artist-hyped-load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml
      - name: Run loopback HTTP and disposable PostgreSQL load
        run: sh ./mvnw --batch-mode --no-transfer-progress '-Dtest=ArtistHypedHttpE2eTest#concurrentHypedLoadKeepsEverySuccessfulHttpClick' test
      - name: Preserve load measurements and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artist-hyped-load-results
          path: |
            target/hyped-load-results/summary.json
            target/surefire-reports/*ArtistHypedHttpE2eTest*
          retention-days: 14
          if-no-files-found: warn
