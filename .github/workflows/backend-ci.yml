name: Backend CI

on:
  pull_request:
  push:
    branches: [main, 'chore/import-festival-project', 'build/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-verify:
    name: backend-verify (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: pom.xml
      - name: Verify backend
        run: sh ./mvnw --batch-mode --no-transfer-progress verify
      - name: Preserve backend test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-java-${{ matrix.java }}
          path: target/surefire-reports/
          retention-days: 14
          if-no-files-found: warn

  api-v2-contract:
    name: api-v2-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api-v2/package-lock.json
      - name: Install contract dependencies
        working-directory: api-v2
        run: npm ci
      - name: Check generated contract and examples
        working-directory: api-v2
        run: npm run check
      - name: Verify redacted release evidence guardrails
        run: node --test tools/release-validation/validate-evidence.test.mjs tools/release-validation/validate-image-provenance.test.mjs tools/release-validation/validate-recovery-plan.test.mjs

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --pull --build-arg VCS_REF="$GITHUB_SHA" -t fall-festival-server:ci .
      - name: Scan candidate image for High and Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fall-festival-server:ci
          scanners: vuln
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Upload image scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image.sarif
          if-no-files-found: error

  security-filesystem:
    name: security-filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scan source, dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          skip-dirs: 'test'
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Upload filesystem scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-report
          path: trivy-fs.sarif
          if-no-files-found: error
