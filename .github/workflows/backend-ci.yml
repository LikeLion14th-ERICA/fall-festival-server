name: Backend CI

on:
  pull_request:
  push:
    branches: [main, 'chore/import-festival-project', 'build/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-verify:
    name: backend-verify (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: pom.xml
      - name: Verify backend
        run: sh ./mvnw --batch-mode --no-transfer-progress verify

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scan repository dependencies and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
      - name: Build Docker image
        run: docker build --pull -t fall-festival-server:ci .
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fall-festival-server:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          skip-setup-trivy: true
