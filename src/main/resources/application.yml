spring:
  application:
    name: fall-festival-server
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  # No classpath static files are served implicitly. The opt-in /docs page
  # serves the few Swagger UI assets it needs itself.
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:10485760B}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:12582912B}
      file-size-threshold: ${SPRING_SERVLET_MULTIPART_FILE_SIZE_THRESHOLD:0B}
  # HikariCP is on the classpath (via spring-boot-starter-jdbc) purely so the
  # "db" profile below can use it. Its presence alone makes DataSourceAutoConfiguration
  # try to build a pool regardless of whether spring.datasource.url is set, so
  # both auto-configurations are excluded here and re-enabled only in "db".
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  tomcat:
    # Admit the initial burst from the supported 500 concurrent readers and
    # avoid the default 100-request HTTP/1.1 connection churn. Both remain
    # bounded and deployment-specific limits can override them.
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:1024}
    max-keep-alive-requests: ${SERVER_TOMCAT_MAX_KEEP_ALIVE_REQUESTS:10000}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

festival:
  id: ${FESTIVAL_ID:}
  # SHA-256 hex of the on-site stamp reward code, comma-separated while rotating.
  # Never put the code itself here; without a value the check answers 503.
  stamp-receipt:
    code-sha256: ${STAMP_RECEIPT_CODE_SHA256:}
  # LOVE-001 remains disabled until an operator configures the period, consent,
  # both seed pools and the server-only encryption key. Never commit real values.
  love-letter:
    key-base64: ${LOVE_LETTER_KEY_BASE64:}
    key-version: ${LOVE_LETTER_KEY_VERSION:v1}
    allowed-origin: ${LOVE_LETTER_ALLOWED_ORIGIN:}
  # Per-client limits on /api/v2. trusted-proxy-hops is the number of proxies in
  # front of the server that append X-Forwarded-For (0 = the socket address).
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    trusted-proxy-hops: ${RATE_LIMIT_TRUSTED_PROXY_HOPS:0}
  # Languages to publish besides Korean, comma-separated (en, zh-Hans). A listed
  # language is served only when its catalog content is complete; otherwise it
  # stays LOCALE_NOT_READY and the reason is logged at startup.
  public-locales: ${PUBLIC_LOCALES:ko}
  # Swagger UI at /docs for local and development servers. Keep it off in production.
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  admin-auth:
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    jwt-signing-secret: ${ADMIN_JWT_SIGNING_SECRET:}
    allowed-origin: ${ADMIN_ALLOWED_ORIGIN:}
    bootstrap-username: ${ADMIN_BOOTSTRAP_USERNAME:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  operational-account:
    # A configured transfer link must use HTTPS and exactly one of these hosts.
    # Leave this empty until the operator has an approved transfer destination.
    transfer-link-allowed-hosts: ${ACCOUNT_TRANSFER_LINK_ALLOWED_HOSTS:}

---
# Activate with SPRING_PROFILES_ACTIVE=db once SPRING_DATASOURCE_* variables are
# set. Without this profile no datasource property exists, so no DataSource bean
# is created and the app keeps starting without external services.
spring:
  config:
    activate:
      on-profile: db
  autoconfigure:
    exclude: []
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Negative timeout skips the eager connection check so the app still
      # starts if the shared DB is temporarily unreachable.
      initialization-fail-timeout: -1
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    clean-disabled: true
    placeholders:
      festivalId: ${FESTIVAL_ID:${festival.id:}}
